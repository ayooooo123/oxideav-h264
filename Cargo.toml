[package]
name = "oxideav-h264"
version = "0.1.8"
edition = "2021"
rust-version = "1.80"
# src/recovery.rs and the loopfilter/NEON kernels in src/reconstruct.rs
# port FFmpeg 2da55bf (LGPL-2.1-or-later, see LICENSE-LGPL); the rest of
# the crate is MIT.
license = "MIT AND LGPL-2.1-or-later"
repository = "https://github.com/OxideAV/oxideav-h264"
homepage = "https://github.com/OxideAV/oxideav-h264"
authors = ["Mark Karpeles"]
description = "Pure-Rust H.264 / AVC (ITU-T H.264 | ISO/IEC 14496-10) codec for oxideav — under spec-driven rewrite, no decode/encode functionality yet"
readme = "README.md"
keywords = ["multimedia", "video", "h264", "avc", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]

[features]
default = []
# Enables `#![feature(portable_simd)]` and the `std::simd` code paths
# in `src/simd/portable.rs`. Requires a nightly toolchain. The default
# build relies on chunked fixed-size arrays that LLVM auto-vectorises
# reliably on stable.
nightly = []

[dependencies]
oxideav-core = "0.1"
thiserror = "2"

# Decoder::output_video_dimensions comes from the PearTube fork of the core,
# at the revision the player pins (a [patch] applies only to this crate's own
# builds; the player's workspace patches the core itself).
[patch.crates-io]
oxideav-core = { git = "https://github.com/ayooooo123/oxideav-core", rev = "96094a916d8b9f2695f70bb0d53e5956b8a79847" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "inter_pred_bench"
harness = false

[[bench]]
name = "transform_bench"
harness = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false
